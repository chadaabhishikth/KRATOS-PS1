# ─────────────────────────────────────────────────────────────────────────────
# KRATOS-PS1 — local demo Mosquitto broker
#
# Listens on ALL interfaces so the ESP32 (and any teammate's laptop) on the
# same Wi-Fi network can reach port 1883.
#
#   START :  mosquitto -c broker/mosquitto.conf
#   VERIFY:  mosquitto_sub -h 127.0.0.1 -t 'kratos/ps1/#' -v
# ─────────────────────────────────────────────────────────────────────────────
listener 1883 0.0.0.0

# Demo/PoC only — no auth on a local-hackathon network.
# (At the venue the broker + engine + ESP32 all stay on one LAN.)
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
